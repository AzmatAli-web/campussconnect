name: Isolated backup and recovery rehearsal
on:
  push:
    paths: ['qa/rehearse-recovery.mjs', '.github/workflows/recovery-rehearsal.yml']
  pull_request:
    paths: ['qa/rehearse-recovery.mjs', '.github/workflows/recovery-rehearsal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix qa run test:recovery
