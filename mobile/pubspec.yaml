name: campusconnect_mobile
description: CampusConnect student Flutter app backed by Firebase and Express
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  material_ui: ^1.11.0
  http: ^1.6.0
  http_parser: ^4.1.1
  image_picker: ^1.1.2
  uuid: ^4.6.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
